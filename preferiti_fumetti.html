<script>
const userId = localStorage.getItem('id_utente');

if (userId) {
  fetch(`http://localhost:3002/user/${userId}`)
    .then(res => res.json())
    .then(user => {
      if (!user || !user.email) return;

      const iniziale = user.email.charAt(0).toUpperCase();
      const badge = document.createElement('div');
      badge.textContent = iniziale;
      badge.classList.add('rounded-circle', 'bg-dark', 'text-white', 'd-flex', 'justify-content-center', 'align-items-center');
      badge.style.width = '40px';
      badge.style.height = '40px';
      badge.style.fontWeight = 'bold';
      badge.style.fontSize = '20px';
      badge.style.cursor = 'pointer';
      badge.title = user.email;

      const userNameElem = document.getElementById("user-name");
      userNameElem.innerHTML = '';
      userNameElem.appendChild(badge);
      userNameElem.href = "utente.html";

      document.getElementById("login-btn").classList.add("d-none");
      document.getElementById("user-info").classList.remove("d-none");
    })
    .catch(err => {
      console.error("Errore nel recupero utente:", err);
    });
}

document.getElementById("logout-btn").addEventListener("click", () => {
  localStorage.clear();
  window.location.href = "login.html";
});

async function caricaFumettiPreferiti() {
  try {
    const res = await fetch(`http://localhost:3002/user/${userId}`);
    const user = await res.json();
    const fumetti = user.fumetti_prefer || [];

    const container = document.getElementById("fumettiContainer");
    container.innerHTML = "";

    if (fumetti.length === 0) {
      container.innerHTML = "<p>Nessun fumetto preferito trovato.</p>";
      return;
    }

    for (const id of fumetti) {
  const comicData = await getComicDetails(id);
  if (comicData) {
    const col = document.createElement("div");
    col.className = "col";

    const card = document.createElement("div");
    card.className = "card p-3 text-center";
    card.style.cursor = "pointer";
    card.onclick = () => {
      window.location.href = `comicDetails.html?id=${comicData.id}`;
    };

    const img = document.createElement("img");
    img.src = `${comicData.thumbnail.path}/portrait_uncanny.${comicData.thumbnail.extension}`;
    img.alt = comicData.title;
    img.className = "card-img-top";

    const title = document.createElement("div");
    title.className = "card-title";
    title.textContent = comicData.title;

    card.appendChild(img);
    card.appendChild(title);
    col.appendChild(card);
    container.appendChild(col);
  }
}
  } catch (err) {
    console.error("Errore nel recupero fumetti preferiti:", err);
    alert("Errore durante il caricamento.");
  }
}

async function getComicDetails(comicId) {
  const ts = Date.now();
  const publicKey = '1ef844cb824d486f8aca3ebeb47cf0ce';
const privateKey = 'a1a5a597f5b58806ef5d614dd7e0e2573769aca0';
const hash = SparkMD5.hash(ts + privateKey + publicKey);
const url = `https://gateway.marvel.com/v1/public/comics/${comicId}?ts=${ts}&apikey=${publicKey}&hash=${hash}`;
  const res = await fetch(url);
  const data = await res.json();
  return data.data.results[0];
}

caricaFumettiPreferiti();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/spark-md5/3.0.2/spark-md5.min.js"></script>
