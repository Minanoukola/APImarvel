<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proposte di Scambio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/spark-md5/3.0.2/spark-md5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
  
  <nav class="navbar navbar-expand-lg navbar-light bg-danger">
    <div class="container-fluid">
      <a class="navbar-brand text-black fw-bold" href="home.html">CGC</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link text-black" href="home.html">Home</a></li>
          <li class="nav-item"><a class="nav-link text-black" href="album.html">Album</a></li>
          <li class="nav-item"><a class="nav-link text-black" href="shop.html">Shop</a></li>
          <li class="nav-item"><a class="nav-link text-black" href="mercato.html">Mercato</a></li>
          <li class="nav-item"><a class="nav-link text-black" href="scambi.html">Scambi</a></li>
        </ul>
        <div id="login-btn" class="d-flex">
          <a href="login.html" class="btn btn-dark me-2">Sign In</a>
        </div>
        <div id="user-info" class="d-none d-flex">
          <a id="user-name" href="utente.html" class="btn btn-dark me-2"></a>
          <a href="#" id="logout-btn" onclick="logoutUtente()" class="btn btn-outline-dark">Logout</a>
        </div>
      </div>
    </div>
  </nav>

  
  <div class="container mt-4">
    <h2 class="text-center mb-4">Proposte di Scambio</h2>
    <div class="row" id="scambiContainer"></div>
  </div>

  <script>
    const api_key = '1ef844cb824d486f8aca3ebeb47cf0ce';
    const private_key = 'a1a5a597f5b58806ef5d614dd7e0e2573769aca0';
    const userId = localStorage.getItem("id_utente");

    async function getMarvelCard(id) {
      const timestamp = Date.now();
      const hash = SparkMD5.hash(`${timestamp}${private_key}${api_key}`);
      const url = `https://gateway.marvel.com/v1/public/characters/${id}?ts=${timestamp}&apikey=${api_key}&hash=${hash}`;
      const res = await fetch(url);
      const data = await res.json();
      return data.data.results[0];
    }

    async function caricaScambi() {
      const res = await fetch("http://localhost:3002/scambi");
      const scambi = await res.json().then(data =>
        data.filter(s => s.stato === "in_attesa").slice(0, 15)
      );

      const userRes = await fetch(`http://localhost:3002/user/${userId}`);
      const user = await userRes.json();
      const album = user.album || [];

      const container = document.getElementById("scambiContainer");
      container.innerHTML = "";

      const promises = scambi.map(async (s) => {
        const [offerta, richiesta, proponenteData] = await Promise.all([
          getMarvelCard(s.cartaOfferta),
          getMarvelCard(s.cartaRichiesta),
          fetch(`http://localhost:3002/user/${s.proponenteId}`).then(r => r.json())
        ]);

        const haCartaRichiesta = album.some(c => c.id === s.cartaRichiesta && c.quantita > 0);
        return { s, offerta, richiesta, proponenteName: proponenteData.name, haCartaRichiesta };
      });

      const results = await Promise.all(promises);

      results.forEach(({ s, offerta, richiesta, proponenteName, haCartaRichiesta }) => {
        const col = document.createElement("div");
        col.className = "col-md-3";

        const èMio = s.proponenteId === userId;

        col.innerHTML = `
          <div class="card shadow-sm mb-2 position-relative">
            ${èMio ? `<button class="btn btn-sm btn-danger position-absolute top-0 end-0 m-2" title="Elimina" onclick="event.stopPropagation(); eliminaScambio('${s._id}')">&times;</button>` : ''}
            <div class="card-body text-center">
              <h5 class="card-title">Scambio</h5>
              <div class="d-flex justify-content-center gap-3 mb-3">
                <div>
                  <img src="${offerta.thumbnail.path}/portrait_small.${offerta.thumbnail.extension}" class="rounded" alt="${offerta.name}">
                  <p class="mt-1 small">${offerta.name}</p>
                </div>
                <div>
                  <img src="${richiesta.thumbnail.path}/portrait_small.${richiesta.thumbnail.extension}" class="rounded" alt="${richiesta.name}">
                  <p class="mt-1 small">${richiesta.name}</p>
                </div>
              </div>
              <p class="small mb-2"><strong>Proposto da:</strong> ${proponenteName}</p>
              ${
                haCartaRichiesta && !èMio
                  ? `<button class="btn btn-success btn-sm w-100" onclick="accettaScambio('${s._id}')">Accetta</button>`
                  : (!haCartaRichiesta && !èMio
                      ? `<div class="alert alert-warning py-1 px-2 small mb-0">Non possiedi la carta richiesta</div>`
                      : '')
              }
            </div>
          </div>
        `;

        container.appendChild(col);
      });
    }

    async function accettaScambio(scambioId) {
      try {
        const res = await fetch(`http://localhost:3002/scambi/${scambioId}/accetta`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ userId: userId })
        });

        const data = await res.json();
        alert(data.message || "Scambio completato!");
        caricaScambi();
      } catch (err) {
        console.error("Errore accettazione:", err);
        alert("Errore durante l'accettazione.");
      }
    }

    async function eliminaScambio(scambioId) {
      if (!confirm("Sei sicuro di voler eliminare questa proposta di scambio?")) return;
      try {
        const res = await fetch(`http://localhost:3002/scambi/${scambioId}`, {
          method: "DELETE"
        });
        const data = await res.json();
        alert(data.message || "Scambio eliminato.");
        caricaScambi();
      } catch (err) {
        console.error("Errore eliminazione:", err);
        alert("Errore durante l'eliminazione dello scambio.");
      }
    }
    async function aggiornaNavbarUtente() {
  try {
    const res = await fetch(`http://localhost:3002/user/${userId}`);
    const user = await res.json();
    const email = user.email || 'U';
    const iniziale = email.charAt(0).toUpperCase();

    const badge = document.createElement("div");
    badge.textContent = iniziale;
    badge.classList.add("rounded-circle", "bg-dark", "text-white", "d-flex", "justify-content-center", "align-items-center");
    badge.title = email;

    const userNameElem = document.getElementById("user-name");
    userNameElem.innerHTML = "";
    userNameElem.appendChild(badge);

    document.getElementById("login-btn").classList.add("d-none");
    document.getElementById("user-info").classList.remove("d-none");
  } catch (e) {
    console.error("Errore caricamento utente:", e);
  }
}
function logoutUtente() {
  localStorage.clear();
  window.location.href = "home.html";
}

window.onload = () => {
  aggiornaNavbarUtente();
  caricaScambi();
};
  </script>
</body>
</html>
