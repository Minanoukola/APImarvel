<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dettagli Autore</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/spark-md5/3.0.2/spark-md5.min.js"></script>
  <link rel="stylesheet" href="style.css">
  </style>
  <style>
    
body {
background-color: #f4f4f4;
padding-top: 100px; 
}


.navbar {
background-color: #e60000 !important;
position: fixed;
top: 0;
width: 100%;
z-index: 1030;
}
.navbar .nav-link,
.navbar .navbar-brand {
color: black !important;
font-weight: bold;
}


.card {
position: relative;
border: none;
overflow: hidden;
height: 100%;
background-color: white;
transition: transform 0.4s ease, background-color 0.3s ease;
}
.card:hover {
transform: scale(1.12);
background-color: #e60000;
color: white;
}
.card:hover .card-title,
.card:hover .card-text {
color: white;
}


.card-img-top {
width: 100%;
height: 260px;
object-fit: cover;
}

.card-body {
padding: 10px;
min-height: 70px;
}


.btn-primary {
background-color: #e60000;
border: none;
}
.btn-primary:hover {
background-color: #cc0000;
}


.carousel-control-prev-icon,
.carousel-control-next-icon {
background-color: rgba(0, 0, 0, 0.5);
border-radius: 50%;
}
.carousel-control-prev,
.carousel-control-next {
display: flex !important;
}


.rarity-badge {
position: absolute;
top: 10px;
left: 10px;
padding: 5px 10px;
font-size: 12px;
font-weight: bold;
color: white;
border-radius: 5px;
text-transform: uppercase;
z-index: 10;
}
.epic-badge { background-color: gold; color: black; }
.rare-badge { background-color: blue; color: white; }
.base-badge { background-color: gray; color: white; }


.carousel .card {
max-width: 180px; 
margin: auto;
height: auto;
min-height: unset;
transition: transform 0.3s ease, background-color 0.3s ease;
}

.carousel .card:hover {
transform: scale(1.08);
background-color: #e60000;
color: white;
}


.carousel .card-img-top {
height: 150px;
object-fit: cover;
}


.carousel .card-title {
font-size: 0.85rem;
margin-top: 5px;
}
.card:hover .btn {
background-color: black !important;
color: white !important;
border: none;
}
</style>
</head>
<body>
  
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
      <button class="btn btn-primary" onclick="history.back()">Torna indietro</button>
    </div>
  </nav>

  
  <div class="container my-4">
    <div class="card mb-3">
      <div class="row g-0 align-items-center">
        <div class="col-md-4">
          <img id="creatorImage" class="img-fluid rounded-start" alt="Immagine Autore">
        </div>
        <div class="col-md-8">
          <div class="card-body">
            <h5 id="creatorName" class="card-title"></h5>
            <p id="creatorDescription" class="card-text"></p>
            <p id="creatorModified" class="card-text"><small class="text-body-secondary">Ultima modifica</small></p>
            <button id="btn_fav" class="btn btn-dark mt-3">Aggiungi ai preferiti</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  
  <div class="container my-4">
    <h2 class="text-center">Fumetti</h2>
    <div id="comicsCarousel" class="carousel slide" data-bs-ride="carousel">
      <div class="carousel-inner" id="comicsInner"></div>
      <button class="carousel-control-prev" type="button" data-bs-target="#comicsCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#comicsCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>
  </div>

  
  <template id="comicCardTemplate">
    <div class="card">
      <div class="card-body">
        <img src="" class="card-img-top" alt="Copertina Fumetto">
        <h5 class="card-title name"></h5>
      </div>
    </div>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const api_key = '1ef844cb824d486f8aca3ebeb47cf0ce';
const private_key = 'a1a5a597f5b58806ef5d614dd7e0e2573769aca0';
    function generateMD5Hash(data) {
      return SparkMD5.hash(data);
    }

    async function getCreatorDetail(creatorId) {
      const ts = Date.now();
      const hash = generateMD5Hash(`${ts}${private_key}${api_key}`);
      const url = `https://gateway.marvel.com/v1/public/creators/${creatorId}?ts=${ts}&apikey=${api_key}&hash=${hash}`;
      const res = await fetch(url);
      const data = await res.json();
      return data.data.results[0];
    }

    async function getCreatorComics(creatorId) {
      const ts = Date.now();
      const hash = generateMD5Hash(`${ts}${private_key}${api_key}`);
      const url = `https://gateway.marvel.com/v1/public/creators/${creatorId}/comics?ts=${ts}&apikey=${api_key}&hash=${hash}&limit=12`;
      const res = await fetch(url);
      const data = await res.json();
      return data.data.results;
    }

    function mostraCreator(creator) {
      document.getElementById("creatorName").textContent = creator.fullName;
      document.getElementById("creatorDescription").textContent = creator.description || "Nessuna descrizione disponibile";
      document.getElementById("creatorModified").textContent = `Ultima modifica: ${new Date(creator.modified).toLocaleDateString()}`;
      if (creator.thumbnail) {
        document.getElementById("creatorImage").src = `${creator.thumbnail.path}.${creator.thumbnail.extension}`;
      } else {
        document.getElementById("creatorImage").src = "https://via.placeholder.com/150";
      }
    }

    function generaCarosello(items, containerId) {
  const container = document.getElementById(containerId);
  const template = document.getElementById("comicCardTemplate");
  container.innerHTML = "";
  let isActive = true;

  for (let i = 0; i < items.length; i += 4) {
    const slide = document.createElement("div");
    slide.className = `carousel-item ${isActive ? "active" : ""}`;
    isActive = false;

    const row = document.createElement("div");
    row.className = "row justify-content-center";

    items.slice(i, i + 4).forEach(item => {
      const col = document.createElement("div");
      col.className = "col-4 col-md-2";

      const clone = template.content.cloneNode(true);
      clone.querySelector(".name").textContent = item.title;

      const img = clone.querySelector(".card-img-top");
      if (item.thumbnail) {
        img.src = `${item.thumbnail.path}/portrait_xlarge.${item.thumbnail.extension}`;
        img.style.cursor = 'pointer';
        img.onclick = () => {
          window.location.href = `comicDetails.html?id=${item.id}`;
        };
      } else {
        img.style.display = 'none';
      }

      col.appendChild(clone);
      row.appendChild(col);
    });

    slide.appendChild(row);
    container.appendChild(slide);
  }
}
    document.getElementById("btn_fav").addEventListener("click", async () => {
  const userId = localStorage.getItem("id_utente");
  const autoreId = new URLSearchParams(window.location.search).get("id");

  if (!userId || !autoreId) {
    alert("Utente non loggato o autore non valido.");
    return;
  }

  try {
    const res = await fetch(`http://localhost:3002/user/${userId}/add-autore`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ autoreId })
    });

    const data = await res.json();
    if (res.ok) {
      alert("Autore aggiunto ai preferiti!");
    } else {
      alert(data.error || "Errore durante l'aggiunta.");
    }
  } catch (err) {
    console.error("Errore:", err);
    alert("Errore server.");
  }
});

    (async function () {
      const param = new URLSearchParams(window.location.search);
      const id = param.get("id");
      if (!id) return;

      const creator = await getCreatorDetail(id);
      if (creator) {
        mostraCreator(creator);

        const comics = await getCreatorComics(id);
        generaCarosello(comics, "comicsInner");
      }
    })();
  </script>
</body>
</html>
