<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestione Account</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-danger">
    <div class="container-fluid">
      <a class="navbar-brand text-black fw-bold" href="home.html">CGC</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link text-black" href="home.html">Hero</a></li>
          <li class="nav-item"><a class="nav-link text-black" href="comics.html">Fumetti</a></li>
          <li class="nav-item"><a class="nav-link text-black" href="shop.html">Shop</a></li>
          <li class="nav-item"><a class="nav-link text-black" href="mercato.html">Mercato</a></li>
          <li class="nav-item"><a class="nav-link text-black" href="scambi.html">Scambi</a></li>
        </ul>
        <div id="login-btn" class="d-flex">
          <a href="login.html" class="btn btn-dark me-2">Sign In</a>
        </div>
        <div id="user-info" class="d-none d-flex">
          <a id="user-name" href="utente.html" class="btn btn-dark me-2"></a>
          <a href="#" id="logout-btn" class="btn btn-outline-dark">Logout</a>
        </div>
      </div>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="row">
      
      <nav class="col-md-3 col-lg-2 sidebar">
        <h4 class="text-center">Account</h4>
        <ul class="nav flex-column">
          <hr />
          <li class="nav-item"><a class="nav-link" href="album.html">Album</a></li>
          <li class="nav-item"><a class="nav-link" href="preferiti.html">Carte Preferite</a></li>
          <li class="nav-item"><a class="nav-link" href="preferiti_autori.html">Autori Preferiti</a></li>
          <li class="nav-item"><a class="nav-link" href="preferiti_fumetti.html">Fumetti Preferiti</a></li>
          <hr />
          <li class="nav-item"><a class="nav-link" href="utente.html">Modifica Profilo</a></li>
        </ul>
        <button class="btn btn-back w-100 mt-3" onClick="history.go(-1);">Torna indietro</button>
      </nav>

      
      <div class="col-md-9">
        <div class="content">
          <h3 class="mb-4">Modifica Dati Profilo</h3>
          <form id="modifica" onsubmit="modificaProfilo(event)">
            <div class="mb-3">
              <label>Email</label>
              <input type="email" id="email" class="form-control" required>
            </div>
            <div class="mb-3">
              <label>Nome</label>
              <input type="text" id="name" class="form-control">
            </div>
            <div class="mb-3">
              <label>Cognome</label>
              <input type="text" id="surname" class="form-control">
            </div>
            <div class="mb-3">
              <label>Nuova Password</label>
              <input type="password" id="password" class="form-control">
            </div>
            <button type="submit" class="btn btn-primary">Salva Modifiche</button>
          </form>

          <hr class="my-4">

          <div class="text-end">
            <button class="btn btn-danger" onclick="eliminaAccount()">❌ Elimina Account</button>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
document.addEventListener("DOMContentLoaded", async () => {
  const userId = localStorage.getItem("id_utente");

  if (!userId) {
    alert("Utente non autenticato");
    window.location.href = "login.html";
    return;
  }

  try {
    const res = await fetch(`http://localhost:3002/user/${userId}`);
    if (!res.ok) throw new Error("Utente non trovato");

    const user = await res.json();
    const email = user.email || "U";

    
    const iniziale = email.charAt(0).toUpperCase();
    const badge = document.createElement("div");
    badge.textContent = iniziale;
    badge.classList.add("rounded-circle", "bg-dark", "text-white", "d-flex", "justify-content-center", "align-items-center");
    badge.style.width = "40px";
    badge.style.height = "40px";
    badge.style.fontWeight = "bold";
    badge.style.fontSize = "20px";
    badge.style.cursor = "pointer";
    badge.title = email;

    const userNameElem = document.getElementById("user-name");
    userNameElem.innerHTML = "";
    userNameElem.appendChild(badge);
    userNameElem.href = "utente.html";

    document.getElementById("login-btn").classList.add("d-none");
    document.getElementById("user-info").classList.remove("d-none");

    document.getElementById("logout-btn").addEventListener("click", () => {
      localStorage.clear();
      window.location.href = "home.html";
    });

    
    document.getElementById("email").value = user.email || '';
    document.getElementById("name").value = user.name || '';
    document.getElementById("surname").value = user.surname || '';

  } catch (err) {
    console.error("Errore nel recupero utente:", err);
    alert("Errore nel recupero dei dati utente");
  }
});

async function modificaProfilo(event) {
  event.preventDefault();
  const userId = localStorage.getItem("id_utente");
  const email = document.getElementById("email").value;
  const name = document.getElementById("name").value;
  const surname = document.getElementById("surname").value;
  const password = document.getElementById("password").value;

  try {
    const response = await fetch(`http://localhost:3002/user/${userId}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, name, surname, password })
    });
    const data = await response.json();
    alert(data.message || "Dati aggiornati con successo");
  } catch (err) {
    alert("Errore durante la modifica del profilo");
  }
}

async function eliminaAccount() {
  const userId = localStorage.getItem("id_utente");
  if (!confirm("Sei sicuro di voler eliminare definitivamente il tuo account?")) return;

  try {
    const res = await fetch(`http://localhost:3002/user/${userId}`, {
      method: 'DELETE'
    });
    if (res.ok) {
      alert("Account eliminato con successo.");
      localStorage.clear();
      window.location.href = "index.html";
    } else {
      alert("Errore durante l'eliminazione dell'account.");
    }
  } catch (err) {
    alert("Errore server durante l'eliminazione.");
  }
}
</script>
</body>
</html>
