        <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-danger">
        <div class="container-fluid">
          <a class="navbar-brand text-black fw-bold" href="home.html">CGC</a>
      
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
            <span class="navbar-toggler-icon"></span>
          </button>
      
          <div class="collapse navbar-collapse" id="navbarContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item"><a class="nav-link text-black" href="home.html">Home</a></li>
              <li class="nav-item"><a class="nav-link text-black" href="album.html">album</a></li>

            </ul>
      
            
            
      
            
          </div>
        </div>
      </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-6">
                <div class="mb-3">
                    <label for="email" class="form-label">email address</label>
                    <input type="email" class="form-control" id="email" aria-describedby="emailHelp">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">password</label>
                    <input type="password" class="form-control" id="password">
                </div>
                <div class="">
                    <button onclick="login()" class="btn btn-primary me-2">login</button>
                    <a href="registrat.html" class="btn btn-primary">registrati</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

           
            if (!email || !password) {
                alert("Per favore, inserisci sia l'email che la password.");
                return;
            }

            try {
                
                const response = await fetch('http://localhost:3002/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                if (!response.ok) {
                    throw new Error('Login fallito. Controlla le credenziali.');
                }

                const user = await response.json();  

               
                localStorage.setItem('id_utente', user.id);
                localStorage.setItem('nome_utente', user.name);
                localStorage.setItem('cognome_utente', user.surname || 'Cognome non disponibile'); 

                alert("Login effettuato con successo!");

               
                window.location.href = "home.html";

            } catch (error) {
                console.error("Errore durante il login:", error);
                alert(error.message || "Errore durante il login");
            }
        }
    </script>
</body>
</html>
