  <script src="https://cdnjs.cloudflare.com/ajax/libs/spark-md5/3.0.2/spark-md5.min.js"></script>
  <script>

    const userId = localStorage.getItem("id_utente");
    const api_key = '1ef844cb824d486f8aca3ebeb47cf0ce';
const private_key = 'a1a5a597f5b58806ef5d614dd7e0e2573769aca0';

    document.addEventListener("DOMContentLoaded", async () => {
  const userId = localStorage.getItem("id_utente");

  if (userId) {
    try {
      const res = await fetch(`http://localhost:3002/user/${userId}`);
      if (!res.ok) throw new Error("Utente non trovato");

      const user = await res.json();
      const email = user.email || "U";

      const iniziale = email.charAt(0).toUpperCase();
      const badge = document.createElement("div");
      badge.textContent = iniziale;
      badge.classList.add("rounded-circle", "bg-dark", "text-white", "d-flex", "justify-content-center", "align-items-center");
      badge.style.width = "40px";
      badge.style.height = "40px";
      badge.style.fontWeight = "bold";
      badge.style.fontSize = "20px";
      badge.style.cursor = "pointer";
      badge.title = email;

      const userNameElem = document.getElementById("user-name");
      userNameElem.innerHTML = "";
      userNameElem.appendChild(badge);
      userNameElem.href = "utente.html";

      document.getElementById("login-btn").classList.add("d-none");
      document.getElementById("user-info").classList.remove("d-none");

      document.getElementById("logout-btn").addEventListener("click", () => {
        localStorage.clear();
        window.location.href = "home.html";
      });

    } catch (err) {
      console.error("Errore nel recupero utente:", err);
    }
  }
});

    function generateMD5Hash(data) {
      return SparkMD5.hash(data);
    }

    async function getCharacterDetails(id) {
      const ts = Date.now();
      const hash = generateMD5Hash(`${ts}${private_key}${api_key}`);
      const url = `https://gateway.marvel.com/v1/public/characters/${id}?ts=${ts}&apikey=${api_key}&hash=${hash}`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        return data.data.results[0];
      } catch (err) {
        console.error("Errore nel recupero del personaggio:", err);
        return null;
      }
    }

    async function fetchPreferiti() {
      try {
        const res = await fetch(`http://localhost:3002/user/${userId}`);
        if (!res.ok) throw new Error("Errore nel recupero dati utente");
        const user = await res.json();

        const preferiti = user.hero_prefer || [];

        const promises = preferiti.map(id => getCharacterDetails(id));
        const results = await Promise.all(promises);

        results.forEach(character => {
          if (character) renderCard(character);
        });

      } catch (err) {
        console.error("Errore nel caricamento preferiti:", err);
        alert("Errore nel caricamento delle carte preferite.");
      } finally {
        document.getElementById("loading").style.display = "none";
      }
    }

    function renderCard(character) {
      const col = document.createElement("div");
      col.className = "col";

      col.innerHTML = `
        <div class="card h-100">
          <img src="${character.thumbnail.path}.${character.thumbnail.extension}" class="card-img-top" alt="${character.name}">
          <div class="card-body">
            <h5 class="card-title">${character.name}</h5>
            <p class="card-text">${character.description || "Nessuna descrizione disponibile."}</p>
          </div>
          <div class="card-footer text-center">
            <a href="card.html?type=character&id=${character.id}" class="btn btn-primary">Dettagli</a>
          </div>
        </div>
      `;

      document.getElementById("container").appendChild(col);
    }

    fetchPreferiti();
  </script>
