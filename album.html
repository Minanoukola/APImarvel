    <script>

        const userId = localStorage.getItem("id_utente");
        const api_key = '1ef844cb824d486f8aca3ebeb47cf0ce';
const private_key = 'a1a5a597f5b58806ef5d614dd7e0e2573769aca0';

        async function fetchAlbumAndRenderCards() {
            try {
                const response = await fetch(`http://localhost:3002/user/${userId}`);
                if (!response.ok) throw new Error("Errore nel recuperare l'utente");

                const user = await response.json();
                const album = user.album || [];

                
                const uniqueEntries = new Map();
                album.forEach(entry => {
                    if (entry.id) {
                        if (!uniqueEntries.has(entry.id)) {
                            uniqueEntries.set(entry.id, { quantita: entry.quantita });
                        } else {
                            uniqueEntries.get(entry.id).quantita += entry.quantita;
                        }
                    }
                });

                const promises = Array.from(uniqueEntries.entries()).map(async ([id, { quantita }]) => {
                    const character = await getCharacterDetails(id);
                    return { character, quantita };
                });

                const results = await Promise.all(promises);

                results.forEach(({ character, quantita }) => {
                    if (character) renderCard(character, quantita);
                });

            } catch (error) {
                console.error("Errore nel caricamento dell'album:", error);
                alert("Errore nel caricamento delle carte dell'album.");
            } finally {
                document.getElementById("loading").style.display = "none";
            }
        }

        function generateMD5Hash(data) {
            return SparkMD5.hash(data);
        }

        async function getCharacterDetails(characterId) {
            const timestamp = Date.now();
            const hash = generateMD5Hash(`${timestamp}${private_key}${api_key}`);
            const parameters = `ts=${timestamp}&apikey=${api_key}&hash=${hash}`;

            try {
                const response = await fetch(`https://gateway.marvel.com/v1/public/characters/${characterId}?${parameters}`);
                if (!response.ok) throw new Error(`Errore API Marvel - status ${response.status}`);
                const data = await response.json();
                return data.data.results[0];
            } catch (error) {
                console.error('Errore recupero personaggio:', error);
                return null;
            }
        }

        function renderCard(character, quantita) {
  const template = document.querySelector('.card-characters');
  const clone = template.cloneNode(true);
  clone.classList.remove('d-none');
  const rarita = calcolaRarita(character);


const badge = clone.querySelector('.rarity-badge');
if (rarita === "epic") {
  badge.textContent = "EPIC";
  badge.classList.add("epic-badge");
} else if (rarita === "rare") {
  badge.textContent = "RARE";
  badge.classList.add("rare-badge");
} else {
  badge.textContent = "BASE";
  badge.classList.add("base-badge");
}

  clone.querySelector('.card-img-top').src = `${character.thumbnail.path}.${character.thumbnail.extension}`;
  clone.querySelector('.card-name').textContent = character.name;
  clone.querySelector('.card-text').innerHTML = `
      ${character.description || 'Nessuna descrizione disponibile.'}
      <br><strong>Quantità possedute: ${quantita}</strong>
  `;
  clone.querySelector('.btn-primary').href = `card.html?id=${character.id}`;

  function calcolaRarita(character) {
  const num = character.comics.available;
  if (num <= 50) return "epic";
  if (num <= 200) return "rare";
  return "base";
}
 
  const sellBtn = document.createElement('button');
  sellBtn.textContent = "Vendi";
  sellBtn.classList.add('btn', 'btn-warning', 'mt-2', 'w-100');
  sellBtn.onclick = () => vendiCarta(character.id);
  clone.querySelector('.card-footer').appendChild(sellBtn);

  
  const scambioBtn = document.createElement('button');
  scambioBtn.textContent = "Proponi Scambio";
  scambioBtn.classList.add('btn', 'btn-info', 'mt-2', 'w-100');
  scambioBtn.onclick = () => {
    
    localStorage.setItem("cartaOfferta", character.id);
    window.location.href = "cerca-scambio.html";
  };
  clone.querySelector('.card-footer').appendChild(scambioBtn);

  document.getElementById('container').appendChild(clone);
}
    async function proponiScambio(cartaOfferta) {
  const destinatarioId = prompt("Inserisci l'ID dell'utente con cui vuoi scambiare:");
  const cartaRichiesta = prompt("Inserisci l'ID della carta che vuoi ottenere:");

  if (!destinatarioId || !cartaRichiesta) {
    alert("Dati mancanti per proporre lo scambio.");
    return;
  }

  try {
    const res = await fetch("http://localhost:3002/scambi", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        proponenteId: localStorage.getItem("id_utente"),
        destinatarioId: destinatarioId,
        cartaOfferta: cartaOfferta,
        cartaRichiesta: cartaRichiesta
      })
    });

    const data = await res.json();
    if (res.ok) {
      alert(data.message || "Scambio proposto con successo!");
    } else {
      alert(data.error || "Errore durante la proposta di scambio.");
    }
  } catch (err) {
    console.error("Errore proposta scambio:", err);
    alert("Errore durante la proposta di scambio.");
  }
}
        

        async function vendiCarta(idCarta) {
    const venditoreId = localStorage.getItem("id_utente");

    try {
        const response = await fetch("http://localhost:3002/market", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: idCarta, venditoreId: venditoreId })
        });

        if (!response.ok) {
            const err = await response.json();
            throw new Error(err.error || "Errore generico");
        }

        alert("Carta messa in vendita con successo!");
    } catch (err) {
        console.error("Errore:", err);
        alert("Errore durante la messa in vendita: " + err.message);
    }
}

        fetchAlbumAndRenderCards();
