<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mercato - Carte in Vendita</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="style.css">
  
</head>
<body>
  
  <nav class="navbar navbar-expand-lg navbar-dark bg-danger fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand text-black fw-bold" href="home.html">CGC</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link text-black" href="home.html">Home</a></li>
          <li class="nav-item"><a class="nav-link text-black" href="album.html">Album</a></li>
          <li class="nav-item"><a class="nav-link text-black" href="shop.html">Shop</a></li>
          <li class="nav-item"><a class="nav-link text-black" href="mercato.html">Mercato</a></li>
          <li class="nav-item"><a class="nav-link text-black" href="scambi.html">Scambi</a></li>
        </ul>
        <div id="login-btn" class="d-flex">
          <a href="login.html" class="btn btn-dark me-2">Sign In</a>
        </div>
        <div id="user-info" class="d-none d-flex">
          <a id="user-name" href="utente.html" class="btn btn-dark me-2"></a>
          <a href="#" id="logout-btn" onclick="logoutUtente()" class="btn btn-outline-dark">Logout</a>
        </div>
      </div>
    </div>
  </nav>
  

  <div class="container">
    <h1 class="mb-4">Mercato - Carte in Vendita</h1>
    <div class="d-flex justify-content-end align-items-center mb-3">
      <span id="creditiDisplay" class="badge bg-success fs-5">Crediti: ...</span>
    </div>
    <div id="loading" class="text-center my-4">
      <div class="spinner-border text-danger"></div>
      <p>Caricamento annunci...</p>
    </div>
    <div class="row row-cols-md-4 row-cols-sm-2 g-4" id="container"></div>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/spark-md5/3.0.2/spark-md5.min.js"></script>
  <script>
   const api_key = '1ef844cb824d486f8aca3ebeb47cf0ce';
const private_key = 'a1a5a597f5b58806ef5d614dd7e0e2573769aca0';

    const acquirenteId = localStorage.getItem("id_utente");
    if (!acquirenteId) {
      window.location.href = "login.html";
    }

    function generateMD5Hash(data) {
      return SparkMD5.hash(data);
    }

    async function mostraCrediti() {
      try {
        const res = await fetch(`http://localhost:3002/user/${acquirenteId}`);
        if (!res.ok) throw new Error("Errore nel caricamento crediti");
        const data = await res.json();
        const crediti = data.crediti || 0;
        document.getElementById("creditiDisplay").textContent = `Crediti: ${crediti}`;
        localStorage.setItem("crediti", crediti);
      } catch (err) {
        console.error("Errore nel recupero crediti:", err);
        document.getElementById("creditiDisplay").textContent = "Crediti: 0";
      }
    }

    async function getCharacterDetails(characterId) {
      const timestamp = Date.now();
      const hash = generateMD5Hash(`${timestamp}${private_key}${api_key}`);
      const parameters = `ts=${timestamp}&apikey=${api_key}&hash=${hash}`;

      try {
        const response = await fetch(`https://gateway.marvel.com/v1/public/characters/${characterId}?${parameters}`);
        if (!response.ok) throw new Error("Errore API Marvel");
        const data = await response.json();
        return data.data.results[0];
      } catch (error) {
        console.error('Errore API Marvel:', error);
        return null;
      }
    }

    async function getVenditoreName(userId) {
      try {
        const res = await fetch(`http://localhost:3002/user/${userId}`);
        if (!res.ok) throw new Error("Utente non trovato");
        const data = await res.json();
        return data.name;
      } catch (error) {
        console.error("Errore nel recupero nome venditore:", error);
        return "Sconosciuto";
      }
    }
    function logoutUtente() {
  localStorage.clear();
  window.location.href = "home.html";
}

    async function fetchMarketCards() {
      try {
        const res = await fetch("http://localhost:3002/market");
        const marketData = await res.json();
        console.log("Risposta da /market:", marketData);

        const validCards = marketData.filter(entry => entry?.id && entry?.venditoreId);

        const cardDetails = await Promise.all(
          validCards.map(async (entry) => {
            try {
              const character = await getCharacterDetails(entry.id);
              const venditoreName = await getVenditoreName(entry.venditoreId);
              return { character, venditoreId: entry.venditoreId, venditoreName };
            } catch (err) {
              console.warn("Salto carta malformata:", entry, err);
              return null;
            }
          })
        );

        const validRendered = cardDetails.filter(c => c && c.character);

        if (validRendered.length === 0) {
          document.getElementById("container").innerHTML = `<p class="text-muted">Nessuna carta in vendita al momento.</p>`;
        } else {
          validRendered.forEach(({ character, venditoreId, venditoreName }) => {
            renderCard(character, venditoreId, venditoreName);
          });
        }
      } catch (err) {
        console.error("Errore nel recupero delle carte dal mercato:", err);
        alert("Errore nel caricamento delle carte.");
      } finally {
        document.getElementById("loading").style.display = "none";
      }
    }

    function renderCard(character, venditoreId, venditoreName) {
  const container = document.getElementById("container");
  const col = document.createElement("div");
  col.className = "col";

  const èMia = venditoreId === acquirenteId;

  col.innerHTML = `
    <div class="card h-100 position-relative" style="cursor: pointer;" onclick="window.location.href='card.html?id=${character.id}'">
      ${èMia ? `
        <button class="btn btn-sm btn-danger position-absolute top-0 end-0 m-2" 
                onclick="event.stopPropagation(); rimuoviCarta(${character.id})" title="Rimuovi dal mercato">
          &times;
        </button>` : ''
      }
      <img src="${character.thumbnail.path}.${character.thumbnail.extension}" 
           class="card-img-top" alt="${character.name}">
      <div class="card-body">
        <h5 class="card-title">${character.name}</h5>
        <p class="card-text">${character.description || "Nessuna descrizione."}</p>
        <p><strong>Venditore:</strong> ${venditoreName}</p>
        <p><strong>Costo:</strong> 1 credito</p>
      </div>
      ${!èMia ? `
      <div class="card-footer">
        <button class="btn btn-success w-100" onclick="event.stopPropagation(); acquistaCarta(${character.id}, '${venditoreId}')">Acquista</button>
      </div>` : ''}
    </div>
  `;

  container.appendChild(col);
}
    async function acquistaCarta(cardId, venditoreId) {
      try {
        const res = await fetch("http://localhost:3002/acquista", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ cardId, acquirenteId })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || "Errore generico");
        }

        if (data.nuovoCredito !== undefined) {
          localStorage.setItem("crediti", data.nuovoCredito);
          mostraCrediti();
        }

        alert("Acquisto completato!");
        location.reload();
      } catch (err) {
        console.error("Errore acquisto:", err);
        alert("Errore durante l'acquisto: " + err.message);
      }
    }
    async function aggiornaNavbarUtente() {
  try {
    const res = await fetch(`http://localhost:3002/user/${acquirenteId}`);
    const user = await res.json();
    const email = user.email || 'U';
    const iniziale = email.charAt(0).toUpperCase();

    const badge = document.createElement("div");
    badge.textContent = iniziale;
    
    badge.title = email;

    const userNameElem = document.getElementById("user-name");
    userNameElem.innerHTML = "";
    userNameElem.appendChild(badge);

    document.getElementById("login-btn").classList.add("d-none");
    document.getElementById("user-info").classList.remove("d-none");
  } catch (e) {
    console.error("Errore caricamento utente:", e);
  }
}
async function rimuoviCarta(cardId) {
  if (!confirm("Sei sicuro di voler rimuovere questa carta dal mercato?")) return;

  try {
    const res = await fetch(`http://localhost:3002/market/${cardId}/${acquirenteId}`, {
      method: "DELETE"
    });

    const data = await res.json();

    if (!res.ok) throw new Error(data.error || "Errore generico");

    alert("Carta rimossa dal mercato!");
    location.reload();
  } catch (err) {
    console.error("Errore rimozione carta:", err);
    alert("Errore durante la rimozione: " + err.message);
  }
}

    document.addEventListener("DOMContentLoaded", () => {
      aggiornaNavbarUtente();
      mostraCrediti();
      fetchMarketCards();
    });
  </script>
</body>
</html>
