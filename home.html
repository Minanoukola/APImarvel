<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Card Game Comics</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        .rarity-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 5px 10px;
            font-size: 12px;
            font-weight: bold;
            color: white;
            border-radius: 5px;
            text-transform: uppercase;
            z-index: 10;
        }
        
        .epic-badge {
            background-color: gold;
            color: black;
        }
        
        .rare-badge {
            background-color: blue;
            color: white;
        }
        
        .base-badge {
            background-color: gray;
            color: white;
        }
        
        
        .dynamic-card {
            position: relative;
        }

        

        body {
    background-color: #f4f4f4;
    padding-top: 150px; 
  }

  .navbar {
    background-color: #e60000 !important; 
    position: fixed;
    top: 0;
    width: 100%;
    z-index: 1030; 
  }

  .nav-link,
  .navbar-brand {
    color: black !important;
    font-weight: bold;
  }

  .container-cards {
    padding: 30 30px; 
  }

  .card {
    height: 90%;
    min-height: 430px;
    margin-bottom: 50px; 
    transition: transform 0.3s ease, background-color 0.3s ease, color 0.3s ease;
    background-color: white;
    border: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .card:hover {
    transform: scale(1.1);
    background-color: #e60000;
    color: white;
  }

  .card:hover .card-title,
  .card:hover .card-text {
    color: white;
  }

  .card-img-top {
    max-height: 180px;
    object-fit: cover;
  }

  .btn-primary {
    background-color: #e60000;
    border: none;
  }

  .btn-primary:hover {
    background-color: #cc0000;
  }
    </style>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-danger">
        <div class="container-fluid">
          <a class="navbar-brand text-black fw-bold" href="home.html">CGC</a>
      
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
            <span class="navbar-toggler-icon"></span>
          </button>
      
          <div class="collapse navbar-collapse" id="navbarContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item"><a class="nav-link text-black" href="home.html">Hero</a></li>
              <li class="nav-item"><a class="nav-link text-black" href="album.html">album</a></li>
              <li class="nav-item"><a class="nav-link text-black" href="shop.html">Shop</a></li>
              <li class="nav-item"><a class="nav-link text-black" href="mercato.html">Mercato</a></li>
              <li class="nav-item"><a class="nav-link text-black" href="scambi.html">Scambi</a></li>
            </ul>
      
            <form class="d-flex me-3" onsubmit="return ricerca()" role="search">
              <input id="query" class="form-control me-2" type="search" placeholder="search" aria-label="search">
              <button class="btn btn-outline-dark" type="submit">Search</button>
            </form>
      
            <div id="login-btn" class="d-flex">
              <a href="login.html" class="btn btn-dark me-2">Sign In</a>
            </div>
      
            <div id="user-info" class="d-none d-flex">
              <a id="user-name" href="#" class="btn btn-dark me-2"></a>
              <a href="#" id="logout-btn" onclick="logout()" class="btn btn-outline-dark">Logout</a>
            </div>
          </div>
        </div>
      </nav>

    <div class="container">
        <div id="container" class="row row-cols-md-4 row-cols-sm-2 row-cols-2 g-4">
            <div id="card-characters" class="col d-none card-characters">
                <div class="card h-100">
                    <div class="rarity-badge"></div>
                    <img src="" class="card-img-top" alt="...">
                    <div class="card-body">
                        <h5 class="card-name"></h5>
                        <p class="card-text"></p>
                    </div>
                    <div class="card-footer">
                        <a href="#" class="btn btn-primary">Dettagli</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container text-center my-4">
        <button id="prev-button" class="btn btn-secondary me-2"><</button>
        <span id="pageNumber" class="mx-3">1</span>
        <button id="next-button" class="btn btn-secondary">></button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/spark-md5/3.0.2/spark-md5.min.js"></script>
    <script>
        
    
document.addEventListener("DOMContentLoaded", async function () {
    const userId = localStorage.getItem("id_utente");

    if (userId) {
        const response = await fetch(`http://localhost:3002/user/${userId}`);
        const userData = await response.json();

        if (userData?.name) {
            document.getElementById("user-name").textContent = `Ciao, ${userData.name.charAt(0).toUpperCase()}.`;
            document.getElementById("user-info").classList.remove("d-none");
            document.getElementById("user-name").href=`utente.html?id_utente=${userId}`;
            document.getElementById("login-btn").classList.add("d-none");
        }
    }
});

window.onload = function () {
    
    getCharacters(); 
    document.getElementById('next-button').addEventListener('click', nextPage);
    document.getElementById('prev-button').addEventListener('click', previousPage);
};
    </script>

    <script src="script.js"></script>

</body>

</html>
