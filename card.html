<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dettagli Personaggio</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/spark-md5/3.0.2/spark-md5.min.js"></script>
    <style>
   
body {
  background-color: #f4f4f4;
  padding-top: 100px; 
}


.navbar {
  background-color: #e60000 !important;
  position: fixed;
  top: 0;
  width: 100%;
  z-index: 1030;
}
.navbar .nav-link,
.navbar .navbar-brand {
  color: black !important;
  font-weight: bold;
}


.card {
  position: relative;
  border: none;
  overflow: hidden;
  height: 100%;
  background-color: white;
  transition: transform 0.4s ease, background-color 0.3s ease;
}
.card:hover {
  transform: scale(1.12);
  background-color: #e60000;
  color: white;
}
.card:hover .card-title,
.card:hover .card-text {
  color: white;
}


.card-img-top {
  width: 100%;
  height: 260px;
  object-fit: cover;
}


.card-body {
  padding: 10px;
  min-height: 70px;
}


.btn-primary {
  background-color: #e60000;
  border: none;
}
.btn-primary:hover {
  background-color: #cc0000;
}


.carousel-control-prev-icon,
.carousel-control-next-icon {
  background-color: rgba(0, 0, 0, 0.5);
  border-radius: 50%;
}
.carousel-control-prev,
.carousel-control-next {
  display: flex !important;
}


.carousel .card {
  max-width: 180px; 
  margin: auto;
  height: auto;
  min-height: unset;
  transition: transform 0.3s ease, background-color 0.3s ease;
}

.carousel .card:hover {
  transform: scale(1.08);
  background-color: #e60000;
  color: white;
}


.carousel .card-img-top {
  height: 150px;
  object-fit: cover;
}


.carousel .card-title {
  font-size: 0.85rem;
  margin-top: 5px;
}
.card:hover .btn {
  background-color: black !important;
  color: white !important;
  border: none;
}
.card.epic:hover {
  background-color: #ffd700 !important;
  color: black !important;
  box-shadow: 0 0 10px rgba(255, 215, 0, 0.7);
}

.card.rare:hover {
  background-color: blue;
  color: white;
}

.card.base:hover {
  background-color: gray;
  color: white;
}
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <button class="btn btn-primary" onclick="history.back()">Torna indietro</button>
    </div>
</nav>


<div class="container my-4">
    <div class="card mb-3">
        <div class="row g-0 align-items-center">
            <div class="col-md-4">
                <img id="image" class="img-fluid rounded-start" alt="">
            </div>
            <div class="col-md-8">
                <div class="card-body">
                    <h5 id="c_name" class="card-title"></h5>
                    <p id="vote_average"></p>
                    <p id="description"></p>
                    <p id="release"><small class="text-body-secondary">Ultimo aggiornamento</small></p>
                    <div class="input-group">
                        <button id="btn_fav" onclick="aggiungi_preferiti()" class="btn btn-primary">Aggiungi ai preferiti</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


<div class="container my-4">
    <h2 class="text-center">COMICS</h2>
    <div id="comicCarousel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner" id="comicsInner"></div>
        <button class="carousel-control-prev" type="button" data-bs-target="#comicCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#comicCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>
</div>

<div class="container my-4">
    <h2 class="text-center">SERIE</h2>
    <div id="seriesCarousel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner" id="seriesInner"></div>
        <button class="carousel-control-prev" type="button" data-bs-target="#seriesCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#seriesCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>
</div>

<div class="container my-4">
    <h2 class="text-center">EVENTI</h2>
    <div id="eventsCarousel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner" id="eventsInner"></div>
        <button class="carousel-control-prev" type="button" data-bs-target="#eventsCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#eventsCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>
</div>

<div class="container my-4">
    <h2 class="text-center">AUTORI</h2>
    <div id="creatorsCarousel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner" id="creatorsInner"></div>
        <button class="carousel-control-prev" type="button" data-bs-target="#creatorsCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#creatorsCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>
</div>

<template id="comics">
    <div class="card">
        <div class="card-body">
            <img src="" class="card-img-top" alt="immagine">
            <h5 class="card-title name"></h5>
        </div>
    </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const api_key = '1ef844cb824d486f8aca3ebeb47cf0ce';
const private_key = 'a1a5a597f5b58806ef5d614dd7e0e2573769aca0';

    function generateMD5Hash(data) {
        return SparkMD5.hash(data);
    }

    async function getdetail(characterId) {
        const timestamp = Date.now();
        const hash = generateMD5Hash(`${timestamp}${private_key}${api_key}`);
        const parameters = `ts=${timestamp}&apikey=${api_key}&hash=${hash}`;
        const response = await fetch(`https://gateway.marvel.com/v1/public/characters/${characterId}?${parameters}`);
        const data = await response.json();
        return data.data.results[0];
    }

    async function getExtraDetails(characterId, resource) {
  const timestamp = Date.now();
  const hash = generateMD5Hash(`${timestamp}${private_key}${api_key}`);
  const base = `ts=${timestamp}&apikey=${api_key}&hash=${hash}`;
  
  let offset = 0;
  const limit = 100;
  let allResults = [];
  let total = 0;

  do {
    const parameters = `${base}&limit=${limit}&offset=${offset}`;
    const response = await fetch(`https://gateway.marvel.com/v1/public/characters/${characterId}/${resource}?${parameters}`);
    const data = await response.json();
    
    const results = data.data.results;
    total = data.data.total;
    allResults = allResults.concat(results);
    offset += limit;
  } while (offset < total);

  return allResults;
}

    function generaCaroselloTemplate(items, containerId, type = "comic") {
        const container = document.getElementById(containerId);
        container.innerHTML = "";
        const template = document.getElementById("comics");
        let isActive = true;

        for (let i = 0; i < items.length; i += 4) {
            const slide = document.createElement("div");
            slide.className = `carousel-item ${isActive ? "active" : ""}`;
            isActive = false;

            const row = document.createElement("div");
            row.className = "row justify-content-center";

            items.slice(i, i + 4).forEach(item => {
                const col = document.createElement("div");
                col.className = "col-6 col-md-3 col-lg-2";

                const clone = template.content.cloneNode(true);
                clone.querySelector(".name").textContent = item.name;

                const img = clone.querySelector(".card-img-top");
                if (item.image) {
                    img.src = item.image;
                    img.style.cursor = 'pointer';

                    if (type === "series") {
                        img.onclick = () => window.location.href = `seriesDetails.html?id=${item.id}`;
                    } else if (type === "creator") {
                        img.onclick = () => window.location.href = `autori.html?id=${item.id}`;
                    } else {
                        img.onclick = () => window.location.href = `comicDetails.html?id=${item.id}`;
                    }
                } else {
                    img.style.display = 'none';
                }

                col.appendChild(clone);
                row.appendChild(col);
            });

            slide.appendChild(row);
            container.appendChild(slide);
        }
    }

    function mostraDetail(character) {
    document.getElementById("c_name").textContent = character.name;
    document.getElementById("description").textContent = character.description || "Nessuna descrizione disponibile";
    document.getElementById("image").src = `${character.thumbnail.path}.${character.thumbnail.extension}`;
    document.getElementById("vote_average").textContent = `Fumetti disponibili: ${character.comics.available}`;
    document.getElementById("release").textContent = `Ultima modifica: ${new Date(character.modified).toLocaleDateString()}`;

    
    const card = document.querySelector(".card.mb-3");
    const rarita = calcolaRaritaPersonaggio(character);
    if (rarita) card.classList.add(rarita);
}

    function mostraAutori(comics) {
        const set = new Map();
        comics.forEach(c => {
            c.creators?.items?.forEach(a => {
                if (!set.has(a.resourceURI)) {
                    set.set(a.resourceURI, {
                        name: `${a.name} (${a.role})`,
                        id: a.resourceURI.split("/").pop(), 
                        thumbnail: null 
                    });
                }
            });
        });

        const dati = Array.from(set.values()).map(author => ({
            id: author.id,
            name: author.name,
            image: author.thumbnail || "https://cdn-icons-png.flaticon.com/512/147/147144.png"
        }));

        generaCaroselloTemplate(dati, "creatorsInner", "creator");
    }
    function calcolaRaritaPersonaggio(character) {
    const num = character.comics.available;
    if (num <= 50) return "epic";
    if (num <= 200) return "rare";
    return "base";
}


    async function aggiungi_preferiti() {
        const param = new URLSearchParams(window.location.search);
        const id_hero = param.get("id");
        const userId = localStorage.getItem("id_utente");
        if (!userId) return alert("Devi essere loggato per aggiungere ai preferiti");
        const response = await fetch(`http://localhost:3002/user/${userId}/fav`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ preferito: id_hero })
        });
        if (response.ok) alert("Aggiunto ai preferiti");
        else alert("Errore durante l'aggiunta ai preferiti");
    }

    const param = new URLSearchParams(window.location.search);
    const id = param.get("id");

    (async function () {
        if (id) {
            const character = await getdetail(id);
            if (character) {
                mostraDetail(character);

                const [comics, series, events] = await Promise.all([
                    getExtraDetails(id, 'comics'),
                    getExtraDetails(id, 'series'),
                    getExtraDetails(id, 'events')
                ]);

                generaCaroselloTemplate(comics.map(c => ({
                    id: c.id,
                    name: c.title,
                    image: `${c.thumbnail.path}/portrait_xlarge.${c.thumbnail.extension}`
                })), "comicsInner", "comic");

                generaCaroselloTemplate(series.map(s => ({
                    id: s.id,
                    name: s.title,
                    image: `${s.thumbnail?.path}/portrait_xlarge.${s.thumbnail?.extension}`
                })), "seriesInner", "series");

                generaCaroselloTemplate(events.map(e => ({
                    name: e.title,
                    image: `${e.thumbnail?.path}/portrait_xlarge.${e.thumbnail?.extension}`
                })), "eventsInner", "event");

                mostraAutori(comics);
            }
        }
    })();
</script>
</body>
</html>
