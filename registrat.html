    <div class="container">
        <div class="mb-3">
            <label for="name" class="form-label">Nome</label>
            <input type="text" class="form-control" id="name" >
        </div>
        <div class="mb-3">
            <label for="surname" class="form-label">Cognome</label>
            <input type="text" class="form-control" id="surname" aria-describedby="emailHelp">
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" aria-describedby="emailHelp">
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password">
        </div>

        <button onclick="registerUser()" class="btn btn-primary">registrati</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
  <script>
    async function registerUser() {
    const name = document.getElementById("name").value.trim();
    const surname = document.getElementById("surname").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    if (!name || !surname || !email || !password) {
        alert("Tutti i campi sono obbligatori!");
        return;
    }

    try {
        console.log("Invio richiesta a /register con:", { name, surname, email, password });

        const response = await fetch("http://localhost:3002/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, surname, email, password }),
        });

        const result = await response.json();
        console.log("Risultato ricevuto:", result);

        if (response.ok) {
            alert(result.message || "Registrazione completata!");
        } else {
            alert(result.error || "Errore durante la registrazione.");
        }
    } catch (error) {
        console.error("Errore di rete:", error);
        alert("Errore di connessione con il server.");
    }
}
</script>
