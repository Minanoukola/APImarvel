<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/spark-md5/3.0.2/spark-md5.min.js"></script>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-danger">
  <div class="container-fluid">
    <a class="navbar-brand text-black fw-bold" href="home.html">CGC</a>
    <div class="collapse navbar-collapse" id="navbarContent">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link text-black" href="home.html">Home</a></li>
        <li class="nav-item"><a class="nav-link text-black" href="album.html">Album</a></li>
        <li class="nav-item"><a class="nav-link text-black" href="shop.html">Shop</a></li>
        <li class="nav-item"><a class="nav-link text-black" href="mercato.html">Mercato</a></li>
        <li class="nav-item"><a class="nav-link text-black" href="scambi.html">Scambi</a></li>
      </ul>
      <div id="login-btn" class="d-flex"><a href="login.html" class="btn btn-dark me-2">Sign In</a></div>
      <div id="user-info" class="d-none d-flex">
        <a id="user-name" href="utente.html" class="btn btn-dark me-2"></a>
        <a href="#" id="logout-btn" class="btn btn-outline-dark">Logout</a>
      </div>
    </div>
  </div>
</nav>


<div class="container-fluid">
  <div class="row">
    <nav class="col-md-3 col-lg-2 sidebar">
        <h4 class="text-center">Account</h4>
        <ul class="nav flex-column">
          <hr />
          <li class="nav-item"><a class="nav-link" href="album.html">Album</a></li>
          <li class="nav-item"><a class="nav-link" href="preferiti.html">Carte Preferite</a></li>
          <li class="nav-item"><a class="nav-link" href="preferiti_autori.html">Autori Preferiti</a></li>
          <li class="nav-item"><a class="nav-link" href="preferiti_fumetti.html">Fumetti Preferiti</a></li>
          <hr />
          <li class="nav-item"><a class="nav-link" href="utente.html">Modifica Profilo</a></li>
        </ul>
        <button class="btn btn-back w-100 mt-3" onClick="history.go(-1);">Torna indietro</button>
      </nav>

    <main class="col-md-9 col-lg-10 content">
      <h2 class="mb-4">Autori Preferiti</h2>
      <div id="autoriContainer" class="row row-cols-2 row-cols-md-4 g-4"></div>
    </main>
  </div>
</div>

<script>
const userId = localStorage.getItem('id_utente');
const publicKey = '1ef844cb824d486f8aca3ebeb47cf0ce';
const privateKey = 'a1a5a597f5b58806ef5d614dd7e0e2573769aca0';

if (userId) {
  fetch(`http://localhost:3002/user/${userId}`)
    .then(res => res.json())
    .then(user => {
      const iniziale = user.email.charAt(0).toUpperCase();
      const badge = document.createElement('div');
      badge.textContent = iniziale;
      badge.className = 'rounded-circle bg-dark text-white d-flex justify-content-center align-items-center';
      badge.style.width = '40px';
      badge.style.height = '40px';
      badge.style.fontWeight = 'bold';
      badge.style.fontSize = '20px';
      badge.title = user.email;
      const userNameElem = document.getElementById("user-name");
      userNameElem.innerHTML = '';
      userNameElem.appendChild(badge);
      document.getElementById("login-btn").classList.add("d-none");
      document.getElementById("user-info").classList.remove("d-none");
    });
}

document.getElementById("logout-btn").addEventListener("click", () => {
  localStorage.clear();
  window.location.href = "login.html";
});

async function caricaAutoriPreferiti() {
  try {
    const res = await fetch(`http://localhost:3002/user/${userId}`);
    const user = await res.json();
    const autori = user.autori_prefer || [];
    const container = document.getElementById("autoriContainer");
    container.innerHTML = "";

    if (autori.length === 0) {
      container.innerHTML = "<p>Nessun autore preferito trovato.</p>";
      return;
    }

    for (const id of autori) {
      const autore = await getAutore(id);
      if (!autore) continue;

      const col = document.createElement("div");
      col.className = "col";

      const card = document.createElement("div");
      card.className = "card p-3 text-center";
      card.style.cursor = "pointer";
      card.onclick = () => {
        window.location.href = `autori.html?id=${id}`;
      };

      const img = document.createElement("img");
      let imageUrl = "https://cdn-icons-png.flaticon.com/512/147/147144.png";

if (
  autore.thumbnail &&
  !autore.thumbnail.path.includes("image_not_available")
) {
  imageUrl = `${autore.thumbnail.path}/portrait_uncanny.${autore.thumbnail.extension}`;
}
img.src = imageUrl;
      img.alt = autore.fullName;
      img.className = "card-img-top";

      const title = document.createElement("div");
      title.className = "card-title mt-2";
      title.textContent = autore.fullName;

      card.appendChild(img);
      card.appendChild(title);
      col.appendChild(card);
      container.appendChild(col);
    }
  } catch (err) {
    console.error("Errore nel recupero autori preferiti:", err);
    alert("Errore durante il caricamento.");
  }
}

async function getAutore(id) {
  const ts = Date.now();
  const hash = SparkMD5.hash(ts + privateKey + publicKey);
  const url = `https://gateway.marvel.com/v1/public/creators/${id}?ts=${ts}&apikey=${publicKey}&hash=${hash}`;
  try {
    const res = await fetch(url);
    const data = await res.json();
    return data.data.results[0];
  } catch (e) {
    console.error("Errore caricamento autore:", e);
    return null;
  }
}

caricaAutoriPreferiti();
</script>
</body>
</html>
